<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>风云WindCloud</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 主布局 */
        .main-layout {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* 文件浏览器侧边栏 */
        .file-sidebar {
            width: 260px;
            background: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: width 0.2s;
        }
        .file-sidebar.collapsed { width: 0; border-right: none; }
        .sidebar-header .open-folder-btn {
            background: none;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.15s;
        }
        .open-folder-btn:hover { border-color: #38bdf8; color: #38bdf8; }
        .file-sidebar .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .file-sidebar .sidebar-header h3 { font-size: 0.9rem; font-weight: 600; }
        .file-tree {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .file-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.15s;
        }
        .file-item:hover { background: #334155; }
        .file-item .icon { font-size: 1rem; }
        .file-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-item .size { font-size: 0.7rem; color: #64748b; }
        .file-breadcrumb {
            padding: 8px 12px;
            border-top: 1px solid #334155;
            font-size: 0.75rem;
            color: #94a3b8;
            display: flex;
            gap: 4px;
        }
        .file-breadcrumb span { cursor: pointer; }
        .file-breadcrumb span:hover { color: #38bdf8; }
        .header {
            padding: 16px 24px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 { font-size: 1.2rem; font-weight: 600; }
        .header h1 span { color: #38bdf8; }
        .header .status { font-size: 0.8rem; color: #94a3b8; }
        .header .status::before {
            content: '';
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #22c55e;
            margin-right: 6px;
        }
        .header .sidebar-toggle {
            background: none;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .header .sidebar-toggle:hover { border-color: #475569; color: #e2e8f0; }
        .header .memory-badge {
            background: #1e3a5f;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .header .settings-btn {
            background: none;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .header .settings-btn:hover { border-color: #475569; color: #e2e8f0; }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.ai {
            align-self: flex-start;
            background: #1e293b;
            border: 1px solid #334155;
            border-bottom-left-radius: 4px;
        }
        .message .agent-badge {
            display: inline-block;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 4px;
            background: #334155;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        /* 多智能体步骤 */
        .steps-container {
            max-width: 80%;
            align-self: flex-start;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 8px;
        }
        .step-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            background: #1e293b;
            border: 1px solid #334155;
        }
        .step-item.type-dispatch {
            background: #1e293b;
            border-left: 3px solid #38bdf8;
        }
        .step-item.type-tool {
            background: #1e293b;
            border-left: 3px solid #f59e0b;
        }
        .step-item.type-answer {
            background: #0f172a;
            border-left: 3px solid #22c55e;
            padding: 12px;
        }
        .step-item.type-error {
            background: #451a03;
            border-left: 3px solid #ef4444;
            color: #fca5a5;
        }
        .step-item .step-emoji { font-size: 1rem; }
        .step-item .step-name {
            font-weight: 600;
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .step-item .step-content {
            flex: 1;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .step-item .step-content .tool-log {
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            background: #0f172a;
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 4px;
            white-space: pre-wrap;
        }
        .message.error {
            align-self: center;
            background: #7f1d1d;
            border: 1px solid #991b1b;
            color: #fca5a5;
            font-size: 0.85rem;
        }
        .message .tool-log {
            font-family: 'Fira Code', 'Cascadia Code', monospace;
            font-size: 0.8rem;
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 8px;
            border-left: 3px solid #f59e0b;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }

        .input-area {
            padding: 16px 24px;
            background: #1e293b;
            border-top: 1px solid #334155;
            display: flex;
            gap: 12px;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-area input:focus { border-color: #38bdf8; }
        .input-area input:disabled { opacity: 0.5; }
        .input-area button {
            padding: 12px 24px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .input-area button:hover { background: #1d4ed8; }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
        .input-area .clear-btn {
            background: #475569;
            padding: 12px 16px;
        }
        .input-area .clear-btn:hover { background: #374151; }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            align-self: flex-start;
        }
        .typing-indicator span {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #64748b;
            animation: bounce 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🐉 <span>大龙瞎</span> · AI操作系统</h1>
        <div style="display:flex;align-items:center;gap:8px;">
            <button class="sidebar-toggle" onclick="toggleSidebar()" title="文件浏览器">📁</button>
            <div class="memory-badge" id="memoryBadge" title="记忆已持久化">💾 记忆</div>
            <div class="status" id="statusBadge">就绪</div>
            <button class="settings-btn" onclick="window.location.href='/setup.html'">⚙️ 设置</button>
        </div>
    </div>

    <div class="main-layout">
        <!-- 文件浏览器侧边栏 -->
        <div class="file-sidebar" id="fileSidebar">
            <div class="sidebar-header">
                <h3>📁 Sandbox 文件</h3>
                <button class="open-folder-btn" onclick="openSandboxFolder()" title="在系统文件管理器中打开">📂 打开</button>
            </div>
            <div class="file-tree" id="fileTree">
                <div style="padding:16px;color:#64748b;font-size:0.85rem;">加载中...</div>
            </div>
            <div class="file-breadcrumb" id="fileBreadcrumb">
                <span onclick="navigateTo('.')">sandbox</span>
            </div>
        </div>

        <!-- 聊天主区域 -->
        <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;">

    <div class="chat-container" id="chatContainer">
        <div class="message ai">你好！我是能直接操作系统的AI。试试说：<br>• 创建一个hello.txt并写入"Hello World"<br>• 列出当前目录<br>• 执行 echo "hello"</div>
    </div>

    <div class="input-area">
        <input type="text" id="messageInput" placeholder="告诉AI要做什么..." autofocus />
        <button class="clear-btn" onclick="clearHistory()">清空</button>
        <button onclick="sendMessage()" id="sendBtn">发送</button>
    </div>
    </div> <!-- end main-layout -->

    <script>
        // 启动时检查配置，未配置则跳转设置页
        (async () => {
            try {
                const resp = await fetch('/api/config');
                const cfg = await resp.json();
                if (!cfg.setupComplete) {
                    window.location.href = '/setup.html';
                }
            } catch (e) {
                console.warn('配置检查失败', e);
            }
        })();

        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusBadge = document.getElementById('statusBadge');

        messageInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerHTML = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'typing-indicator';
            div.id = 'typing';
            div.innerHTML = '<span></span><span></span><span></span>';
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            statusBadge.textContent = '思考中...';
        }

        function hideTyping() {
            const t = document.getElementById('typing');
            if (t) t.remove();
            statusBadge.textContent = '就绪';
        }

        function formatResponse(text, agentName) {
            try {
                const obj = JSON.parse(text);
                let html = '';
                if (agentName) html += `<div class="agent-badge">${agentName}</div>`;
                if (obj.tool) {
                    html += `🔧 执行: <b>${obj.tool}</b>`;
                    if (obj.args) html += `<div class="tool-log">${JSON.stringify(obj.args, null, 2)}</div>`;
                }
                if (obj.answer) html += `<br>${escapeHtml(obj.answer)}`;
                return html;
            } catch { return (agentName ? `<div class="agent-badge">${agentName}</div>` : '') + escapeHtml(text); }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateMemoryBadge() {
            const badge = document.getElementById('memoryBadge');
            if (badge) badge.style.background = '#1e3a5f';
        }

        function renderSteps(steps) {
            const container = document.createElement('div');
            container.className = 'steps-container';

            steps.forEach(step => {
                const div = document.createElement('div');
                div.className = `step-item type-${step.type || 'answer'}`;
                div.innerHTML = `
                    <span class="step-emoji">${step.emoji}</span>
                    <div style="flex:1">
                        <div class="step-name">${step.agentName}</div>
                        <div class="step-content">${escapeHtml(step.content)}</div>
                    </div>
                `;
                container.appendChild(div);
                chatContainer.appendChild(container);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            messageInput.value = '';
            messageInput.disabled = true;
            sendBtn.disabled = true;
            addMessage(escapeHtml(text), 'user');
            showTyping();

            try {
                const resp = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await resp.json();
                hideTyping();
                if (data.error) {
                    addMessage(data.message || '请求失败', 'error');
                    if (data.message && data.message.includes('配置')) {
                        setTimeout(() => window.location.href = '/setup.html', 1500);
                    }
                } else {
                    // 先显示多智能体步骤
                    if (data.steps && data.steps.length > 0) {
                        renderSteps(data.steps);
                    }
                    if (data.agent) {
                        statusBadge.textContent = data.agent;
                    }
                    // 更新记忆徽章
                    updateMemoryBadge();
                }
            } catch (err) {
                hideTyping();
                addMessage('请求失败: ' + err.message, 'error');
            } finally {
                messageInput.disabled = false;
                sendBtn.disabled = false;
                messageInput.focus();
            }
        }

        async function clearHistory() {
            try {
                await fetch('/api/history', { method: 'DELETE' });
                chatContainer.innerHTML = '<div class="message ai">会话已清空，重新开始。</div>';
            } catch (err) {
                addMessage('清空失败: ' + err.message, 'error');
            }
        }

        // ==================== 文件浏览器 ====================
        let currentPath = '.';

        function toggleSidebar() {
            document.getElementById('fileSidebar').classList.toggle('collapsed');
            if (!document.getElementById('fileSidebar').classList.contains('collapsed')) {
                loadFiles(currentPath);
            }
        }

        async function loadFiles(path) {
            currentPath = path || '.';
            const tree = document.getElementById('fileTree');
            tree.innerHTML = '<div style="padding:16px;color:#64748b;font-size:0.85rem;">加载中...</div>';

            try {
                const resp = await fetch(`/api/files?path=${encodeURIComponent(currentPath)}`);
                const data = await resp.json();

                if (data.error) {
                    tree.innerHTML = `<div style="padding:16px;color:#fca5a5;font-size:0.85rem;">${data.error}</div>`;
                    return;
                }

                if (!data.items || data.items.length === 0) {
                    tree.innerHTML = '<div style="padding:16px;color:#64748b;font-size:0.85rem;">(空目录)</div>';
                } else {
                    tree.innerHTML = data.items.map(item => {
                        const icon = item.isDir ? '📁' : getFileIcon(item.name);
                        const size = item.isDir ? '' : formatSize(item.size);
                        return `<div class="file-item" onclick="${item.isDir ? `loadFiles('${currentPath === '.' ? '' : currentPath + '/'}${item.name}')` : `openFile('${currentPath === '.' ? '' : currentPath + '/'}${item.name}')`}">
                            <span class="icon">${icon}</span>
                            <span class="name">${item.name}</span>
                            ${size ? `<span class="size">${size}</span>` : ''}
                        </div>`;
                    }).join('');
                }

                // 更新面包屑
                updateBreadcrumb(currentPath);
            } catch (err) {
                tree.innerHTML = `<div style="padding:16px;color:#fca5a5;font-size:0.85rem;">加载失败: ${err.message}</div>`;
            }
        }

        function getFileIcon(name) {
            const ext = name.split('.').pop().toLowerCase();
            const icons = { js: '📜', py: '🐍', java: '☕', html: '🌐', css: '🎨', json: '📋', md: '📝', txt: '📄', yml: '⚙️', yaml: '⚙️', xml: '📰', sh: '🔧' };
            return icons[ext] || '📄';
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + 'B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + 'KB';
            return (bytes / (1024 * 1024)).toFixed(1) + 'MB';
        }

        function updateBreadcrumb(path) {
            const bc = document.getElementById('fileBreadcrumb');
            if (path === '.') {
                bc.innerHTML = '<span onclick="loadFiles(\'.\')" >sandbox</span>';
                return;
            }
            const parts = path.split('/');
            let html = `<span onclick="loadFiles('.')">sandbox</span>`;
            let current = '';
            for (const part of parts) {
                if (!part) continue;
                current = current ? current + '/' + part : part;
                html += ` / <span onclick="loadFiles('${current}')">${part}</span>`;
            }
            bc.innerHTML = html;
        }

        // ==================== 打开沙箱文件夹 ====================
        async function openSandboxFolder() {
            try {
                const resp = await fetch('/api/sandbox/open', { method: 'POST' });
                const data = await resp.json();
                if (data.error) {
                    addMessage('打开失败: ' + data.error, 'error');
                } else {
                    addMessage('📂 已打开沙箱目录', 'ai');
                }
            } catch (err) {
                addMessage('打开失败: ' + err.message, 'error');
            }
        }

        async function openFile(path) {
            try {
                const resp = await fetch(`/api/files/read?path=${encodeURIComponent(path)}`);
                const data = await resp.json();
                if (data.error) {
                    addMessage(`📄 ${path} 读取失败: ${data.error}`, 'error');
                    return;
                }
                const preview = data.content.length > 300 ? data.content.substring(0, 300) + '\n...(已截断)' : data.content;
                addMessage(`📄 <b>${path}</b> (${data.size} 字节)<div class="tool-log">${escapeHtml(preview)}</div>`, 'ai');
            } catch (err) {
                addMessage(`📄 ${path} 读取失败: ` + err.message, 'error');
            }
        }
    </script>
</body>
</html>
